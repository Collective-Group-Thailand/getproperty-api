# Deploy to the Collective platform (D-230, docs/deployment.md) through collective-infra's reusable workflows
# (examples/product-deploy.yml; the image is built by ./build-image.yml, which checks out both private siblings):
# main → build arm64 :sha-… + :uat → deploy UAT · tag vX.Y.Z → build :prod → deploy
# production (GitHub Environment `production` approval). The box pulls api/worker/ingest/migrate at IMAGE_TAG, runs
# the one-shot migrate (asset-core core schema → prisma/migrations → optional TimescaleDB), starts the containers,
# health-checks them through Caddy and rolls back on failure. getproperty-web / getproperty-liff deploy their own
# images with `component: web|liff` (docs/deployment.md §7).
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  build-uat:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-image.yml
    with:
      environment: uat
      moving_tag: uat
    secrets:
      sibling_read_token: ${{ secrets.ASSET_CORE_READ_TOKEN }}

  deploy-uat:
    needs: build-uat
    uses: Collective-Group-Thailand/collective-infra/.github/workflows/reusable-deploy.yml@v1
    with:
      product: getproperty
      component: api
      environment: uat
      image_tag: ${{ needs.build-uat.outputs.image_tag }}

  build-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build-image.yml
    with:
      environment: production
      moving_tag: prod
    secrets:
      sibling_read_token: ${{ secrets.ASSET_CORE_READ_TOKEN }}

  deploy-prod:
    needs: build-prod
    uses: Collective-Group-Thailand/collective-infra/.github/workflows/reusable-deploy.yml@v1
    with:
      product: getproperty
      component: api
      environment: production
      image_tag: ${{ needs.build-prod.outputs.image_tag }}
