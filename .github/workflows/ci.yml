name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint · format · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          asset-core-token: ${{ secrets.ASSET_CORE_READ_TOKEN }}
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm release:check

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          asset-core-token: ${{ secrets.ASSET_CORE_READ_TOKEN }}
      - run: pnpm test:cov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

  e2e:
    name: e2e (fake data stores)
    runs-on: ubuntu-latest
    env:
      DATA_STORES_MODE: fake
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          asset-core-token: ${{ secrets.ASSET_CORE_READ_TOKEN }}
      - run: pnpm test:e2e

  migrations:
    # Real PostgreSQL 18 (no TimescaleDB needed, D-162): @collective/asset-core migrations → prisma migrate deploy →
    # drift check → seeds (twice) → integration suite (RLS, append-only, settings, idempotency, tariffs).
    name: migrations · prisma drift · seeds · integration (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gp
          POSTGRES_PASSWORD: gp
          POSTGRES_DB: getproperty
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gp" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://gp:gp@localhost:5432/getproperty
      SHADOW_DATABASE_URL: postgresql://gp:gp@localhost:5432/getproperty_shadow
      INT_DATABASE_URL: postgresql://gp:gp@localhost:5432/postgres
      PRISMA_MIGRATE_DIFF: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          asset-core-token: ${{ secrets.ASSET_CORE_READ_TOKEN }}
      - name: Create the shadow database
        run: psql "postgresql://gp:gp@localhost:5432/postgres" -c 'CREATE DATABASE getproperty_shadow'
      - name: Migrate (asset-core, then prisma migrate deploy)
        run: pnpm db:migrate
      - name: Prisma drift (schema ↔ migrated database) must be empty
        run: pnpm db:diff
      - name: Prisma drift (schema ↔ migrations replayed on the shadow database, core via initShadowDb)
        run: pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema --exit-code
      - name: Seeds are idempotent
        run: pnpm db:seed:dev && pnpm db:seed:dev
      - name: Integration tests
        run: pnpm test:int

  e2e-real:
    # Testcontainers (Redis, EMQX) for the real-mode e2e suite; runs on demand or with the `e2e:real` label.
    name: e2e (real data stores, Testcontainers)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e:real')
    env:
      DATA_STORES_MODE: real
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          asset-core-token: ${{ secrets.ASSET_CORE_READ_TOKEN }}
      - run: pnpm test:e2e

  contract:
    name: contract build · lint · drift · oasdiff breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          asset-core-token: ${{ secrets.ASSET_CORE_READ_TOKEN }}
      - name: Regenerate the contracts
        run: pnpm contract:build
      - name: Contract lint (Spectral, api-conventions §5)
        run: pnpm contract:lint
      - name: Contract drift (commit the regenerated contract/*.json)
        run: git diff --exit-code -- contract/openapi.json contract/device-protocol.json
      - name: Breaking changes vs base branch
        if: github.event_name == 'pull_request'
        env:
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'contract:breaking') }}
        run: |
          if ! git show "origin/${{ github.base_ref }}:contract/openapi.json" > /tmp/base-openapi.json 2>/dev/null; then
            echo "No contract on ${{ github.base_ref }} yet — skipping breaking-change check."
            exit 0
          fi
          set +e
          docker run --rm -v /tmp:/base:ro -v "$PWD/contract":/head:ro tufin/oasdiff:v1.11.7 \
            breaking /base/base-openapi.json /head/openapi.json --fail-on ERR --format githubactions
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$ALLOW_BREAKING" != "true" ]; then
            echo "::error::Breaking contract change. Use a new version prefix or coordinate with a getproperty-web / getproperty-edge PR and add the 'contract:breaking' label (api-conventions §1)."
            exit 1
          fi

  build:
    name: build · image · scan
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          asset-core-token: ${{ secrets.ASSET_CORE_READ_TOKEN }}
      - run: pnpm build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: asset-core-src=../collective-asset-core
          load: true
          tags: getproperty-api:ci
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image carries the four commands, the migrations, TZ, and the entrypoint picks them
        run: |
          docker run --rm --entrypoint /bin/sh getproperty-api:ci -c 'ls dist/src/main.js dist/src/worker.js dist/src/ingest.js dist/src/migrate.js prisma/migrations prisma/optional/timescale'
          docker run --rm getproperty-api:ci node -e "process.exit(Intl.DateTimeFormat().resolvedOptions().timeZone === 'Asia/Bangkok' ? 0 : 1)"
          docker run --rm -e PROCESS=bogus getproperty-api:ci && exit 1 || test $? -eq 64
      - name: Image scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: getproperty-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
