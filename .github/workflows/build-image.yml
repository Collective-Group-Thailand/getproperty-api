# Build the arm64 image → ECR. Same steps as collective-infra's reusable-build-push.yml@v1, which allows one extra
# checkout; the Dockerfile needs two private siblings as named build contexts: @collective/asset-core
# (`asset-core-src`, ADR-0011) and collective-shared (`collective-shared-src`, D-275, D-278). Without the second one
# buildx tries to pull `collective-shared-src` from Docker Hub and fails. Back to the reusable workflow once the
# packages are on GitHub Packages (or it accepts several extra checkouts).
name: Build image

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment whose deploy role may push: uat | production'
        type: string
        required: true
      moving_tag:
        description: 'uat | prod'
        type: string
        required: true
    secrets:
      sibling_read_token:
        description: Read token for collective-asset-core and collective-shared (private)
        required: true
    outputs:
      image_tag:
        value: ${{ jobs.build.outputs.image_tag }}

permissions:
  id-token: write
  contents: read
  packages: read

env:
  IMAGE: getproperty/api
  ASSET_CORE_REF: v0.5.0 # matches .github/actions/setup and package.json
  COLLECTIVE_SHARED_REF: main

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment }}
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Collective-Group-Thailand/collective-asset-core
          ref: ${{ env.ASSET_CORE_REF }}
          path: .asset-core
          token: ${{ secrets.sibling_read_token }}

      - uses: actions/checkout@v4
        with:
          repository: Collective-Group-Thailand/collective-shared
          ref: ${{ env.COLLECTIVE_SHARED_REF }}
          path: .collective-shared
          token: ${{ secrets.sibling_read_token }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-7' }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - id: meta
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha_tag=sha-${sha::7}" >> "$GITHUB_OUTPUT"
          echo "registry=${{ steps.ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.registry }}/${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.registry }}/${{ env.IMAGE }}:${{ inputs.moving_tag }}
          # public values only (vars.BUILD_ARGS per GitHub Environment); secrets never go into an image
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            ${{ vars.BUILD_ARGS }}
          build-contexts: |
            asset-core-src=.asset-core
            collective-shared-src=.collective-shared
          cache-from: type=registry,ref=${{ steps.meta.outputs.registry }}/${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.registry }}/${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
