%% EMQX 5 authorization rules for local development (docker-compose.yml). Evaluated top-down; no match → deny.
%% Production ACLs come from the device registry (one row per gateway certificate: publish gp/v1/<gatewayId>/+,
%% subscribe gp/v1/<gatewayId>/config and /cmd — device-protocol.md §1), pushed to EMQX by the API (B3.1).

%% The API processes (ingest shared subscription, config/cmd publisher, health probe).
{allow, {username, "getproperty-api"}, all, ["gp/v1/+/#", "$share/ingest/gp/v1/+/#", "$share/+/gp/v1/+/#"]}.

%% The dev gateway (`pnpm sim:gateway`, B6.5, and a hand-held mosquitto_pub): every gp/v1 topic.
{allow, {username, "getproperty-dev"}, all, ["gp/v1/+/#"]}.

%% Dashboard / diagnostics.
{allow, {username, "getproperty-dev"}, subscribe, ["$SYS/#"]}.

{deny, all}.
